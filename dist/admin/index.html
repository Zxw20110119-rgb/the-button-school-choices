<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f1e7">
  <title>Admin · The Button</title>
  <link rel="icon" href="../favicon.svg">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="../"><span class="logo-dot" aria-hidden="true"></span>The Button</a>
    <button class="secondary-action" id="signOut" hidden>Sign out</button>
  </header>
  <main class="shell">
    <section class="login" id="login" aria-labelledby="loginTitle">
      <h1 id="loginTitle">Admin sign-in</h1>
      <p>Enter your approved admin email to receive a sign-in link.</p>
      <form id="loginForm">
        <label>Email address <input id="email" type="email" autocomplete="email" required></label>
        <button class="primary-action" type="submit">Send sign-in link</button>
      </form>
      <p class="status" id="loginStatus" role="status"></p>
    </section>

    <section class="dashboard" id="dashboard" aria-labelledby="dashTitle" hidden>
      <div class="dash-head">
        <h1 id="dashTitle">Manage questions</h1>
        <button class="primary-action" id="addQuestion">Add question</button>
      </div>
      <dl class="metrics">
        <div><dt>Active questions</dt><dd id="mActive">—</dd></div>
        <div><dt>Real votes</dt><dd id="mVotes">—</dd></div>
        <div><dt>Strong questions</dt><dd id="mStrong">—</dd></div>
        <div><dt>Needs revision</dt><dd id="mRevision">—</dd></div>
      </dl>
      <div class="toolbar">
        <label>Category <select id="categoryFilter"><option value="">All categories</option></select></label>
        <label>Sort by
          <select id="sortBy">
            <option value="divisive">Most divisive</option><option value="votes">Most votes</option>
            <option value="newest">Newest</option><option value="one-sided">Most one-sided</option>
          </select>
        </label>
        <label class="search">Search questions <input id="search" type="search"></label>
      </div>
      <div class="table-wrap" tabindex="0" role="region" aria-label="Question results">
        <table>
          <thead><tr><th scope="col">ID</th><th scope="col">Dilemma</th><th scope="col">Result</th><th scope="col">Votes</th><th scope="col">Quality</th><th scope="col">Status</th><th scope="col">Actions</th></tr></thead>
          <tbody id="questionRows"></tbody>
        </table>
      </div>
      <p class="empty" id="empty" hidden>No questions match these filters.</p>
    </section>
  </main>

  <dialog id="editor" aria-labelledby="editorTitle">
    <button class="dialog-close" id="closeEditor" aria-label="Close">×</button>
    <h2 id="editorTitle">Add question</h2>
    <form id="editorForm">
      <input id="questionId" type="hidden">
      <label>Category <input id="editCategory" required maxlength="40"></label>
      <label>The deal <textarea id="editBenefit" required maxlength="240"></textarea></label>
      <label>The catch <textarea id="editConsequence" required maxlength="240"></textarea></label>
      <div class="form-grid">
        <label>Press value <input id="editPressValue" required maxlength="30" placeholder="Progress"></label>
        <label>Walk-away value <input id="editWalkValue" required maxlength="30" placeholder="Caution"></label>
      </div>
      <label class="check"><input id="editActive" type="checkbox" checked> Available to players</label>
      <button class="primary-action" type="submit">Save question</button>
      <p class="status" id="editorStatus" role="status"></p>
    </form>
  </dialog>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="../config.js" defer></script>
  <script src="./admin.js" defer></script>
</body>
</html>
